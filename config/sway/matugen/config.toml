[config]
type = "scheme-content"
mode = "dark"

[templates.sway]
input_path = '~/.config/sway/matugen/templates/colors.conf'
output_path = '~/.config/sway/colors.conf'

[templates.waybar]
input_path = '~/.config/sway/matugen/templates/colors.css'
output_path = '~/.config/waybar/sway/colors.css'

[templates.fcitx5]
input_path = '~/.config/matugen/templates/fcitx5-theme.conf'
output_path = '~/.local/share/fcitx5/themes/matugen/theme.conf'

[templates.rofi]
input_path = '~/.config/matugen/templates/colors.rasi'
output_path = '~/.config/sway/rofi-colors.rasi'
