# Hyprland 下的 xdg-desktop-portal 后端选择
# 参考: /usr/share/doc/xdg-desktop-portal/portals.config.md 与发行版自带
#       /usr/share/xdg-desktop-portal/hyprland-portals.conf (default=hyprland;gtk)
#
# 生效顺序: 先按接口找 preferred 里声明的后端, 找不到就按 ; 分隔的列表回退。
# hyprland 后端只实现 Screenshot/ScreenCast/GlobalShortcuts/InputCapture
# (见 /usr/share/xdg-desktop-portal/portals/hyprland.portal), 其余接口自动落到 gtk。

[preferred]
default=hyprland;gtk

# 文件选择/另存为 -> GTK 原生对话框 (org.freedesktop.portal.FileChooser)
# 注: 之前这里指向 termfilechooser(yazi in kitty), 但它的包装脚本会段错误,
# journal 里可见 "yazi-wrapper.sh: 段错误 (核心已 dumped) exit code -139"
# 以及 "Backend call failed: Operation not permitted", 故移除。
# 若要恢复终端式选择器, 把下面这行的注释放开即可:
# org.freedesktop.impl.portal.FileChooser=termfilechooser

# 密钥环走 gnome-keyring (已在运行: /run/user/1000/keyring)
org.freedesktop.impl.portal.Secret=gnome-keyring
