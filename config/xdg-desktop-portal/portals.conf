# Niri 下的 xdg-desktop-portal 后端选择
# Niri 官方推荐 gnome;gtk；本机已安装 Nautilus，因此文件选择器使用 GNOME portal。
#
# 生效顺序: 先按接口找 preferred 里声明的后端, 找不到就按 ; 分隔的列表回退。
# gnome 后端负责 Niri 常用的桌面接口；gtk 作为其他接口的回退。

[preferred]
default=gnome;gtk

# Steam 的“添加非 Steam 游戏/添加库/浏览”依赖 FileChooser；GNOME portal
# 会通过已安装的 Nautilus 提供文件选择器，并能正确处理 Steam 的 X11 父窗口。
org.freedesktop.impl.portal.FileChooser=gnome

# 之前的 termfilechooser 包装脚本曾出现段错误，因此不再作为回退。

# 密钥环走 gnome-keyring (已在运行: /run/user/1000/keyring)
org.freedesktop.impl.portal.Secret=gnome-keyring
